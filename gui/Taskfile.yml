version: '3'

vars:
  APP_NAME: "Skell"
  BIN_DIR: "build/bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: build:cli
      - task: "{{.GOOS}}:build"

  build:cli:
    summary: Builds the companion CLI required by the desktop app
    # The label keeps one fingerprint per target platform, so a build for
    # another OS or architecture is never skipped as "up to date". Without the
    # fingerprint the CLI (and its ~260 packages) was rebuilt on every change
    # while running `wails3 dev`.
    label: build:cli ({{.GOOS}}/{{.ARCH | default ARCH}})
    dir: ..
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: gui/**/*
      - exclude: .claude/**/*
    vars:
      CLI_EXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      # Tag builds (CI) pass the tag; local builds use git describe.
      CLI_VERSION:
        sh: echo "${GITHUB_REF_NAME:-$(git describe --tags --always 2>/dev/null || echo dev)}"
    # The CLI is built into gui/embedded/, which the app embeds (cli_embed.go):
    # the desktop app carries the skell it drives and unpacks it on first use,
    # so it works on a computer that has never had skell installed.
    generates:
      - "gui/embedded/skell{{.CLI_EXE}}"
    cmds:
      - go build -trimpath -ldflags "-s -w -X github.com/aminmesbahi/skell/internal/version.Version={{.CLI_VERSION}}" -o "gui/embedded/skell{{.CLI_EXE}}" .
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: '0'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
