version: 2

project_name: skell

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: skell
    main: .
    binary: skell
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/aminmesbahi/skell/internal/version.Version={{.Version}} -X github.com/aminmesbahi/skell/internal/version.Commit={{.Commit}} -X github.com/aminmesbahi/skell/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # The command-line tool: skell_cli_<version>_<os>_<arch>.tar.gz (.zip on
  # Windows). The desktop app is published as skell_gui_… and the two together
  # as skell_bundle_… by release.yml, so every file on the release page says
  # what it is. 'skell selfupdate' and the install scripts rely on this name.
  - id: skell-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "skell_cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aminmesbahi
    name: skell
  replace_existing_artifacts: true
  draft: false
  prerelease: auto
  header: |
    ## Which file do I need?

    Not sure? Take the **bundle** (command line + desktop app) for your system. Only the files for your system matter; ignore the rest.

    | Your system | Command line + desktop app | Desktop app only | Command line only |
    |---|---|---|---|
    | Windows (64-bit) | `skell_bundle_{{ .Version }}_windows_amd64.zip` | `skell_gui_{{ .Version }}_windows_amd64_installer.exe` | `skell_cli_{{ .Version }}_windows_amd64.zip` |
    | Windows (ARM) | `skell_bundle_{{ .Version }}_windows_arm64.zip` | `skell_gui_{{ .Version }}_windows_arm64_installer.exe` | `skell_cli_{{ .Version }}_windows_arm64.zip` |
    | macOS (Apple Silicon) | `skell_bundle_{{ .Version }}_darwin_arm64.zip` | `skell_gui_{{ .Version }}_darwin_arm64.dmg` | `skell_cli_{{ .Version }}_darwin_arm64.tar.gz` |
    | macOS (Intel) | | | `skell_cli_{{ .Version }}_darwin_amd64.tar.gz` |
    | Linux (64-bit) | | `skell_gui_{{ .Version }}_linux_amd64.tar.gz` | `skell_cli_{{ .Version }}_linux_amd64.tar.gz` |
    | Linux (ARM) | | | `skell_cli_{{ .Version }}_linux_arm64.tar.gz` |

    Prefer one command? Windows: `irm https://raw.githubusercontent.com/aminmesbahi/skell/main/install.ps1 | iex` · macOS / Linux: `curl -fsSL https://raw.githubusercontent.com/aminmesbahi/skell/main/install.sh | sh`

    Files ending in `.sha256`, and `checksums.txt`, are for verifying a download.

# Package managers. Each publishes only when its token secret is configured
# (add the secret in the repo settings and pass it in release.yml), so a
# release never fails because a tap or bucket isn't set up yet.
homebrew_casks:
  - name: skell
    ids: [skell-archive]
    repository:
      owner: aminmesbahi
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ end }}'
    homepage: "https://github.com/aminmesbahi/skell"
    description: "Package manager for Agent Skills (SKILL.md) for Claude Code, Codex, Copilot, Cursor and more"
    license: "Apache-2.0"
    hooks:
      post:
        # The binary is not notarised; drop the quarantine flag so macOS runs it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/skell"]
          end

scoops:
  - name: skell
    ids: [skell-archive]
    repository:
      owner: aminmesbahi
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "") "" }}true{{ end }}'
    homepage: "https://github.com/aminmesbahi/skell"
    description: "Package manager for Agent Skills (SKILL.md)"
    license: "Apache-2.0"
