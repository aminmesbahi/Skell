name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The command reference is generated from the CLI definitions; fail when
      # a command changed without regenerating it.
      - name: Command reference is up to date
        run: |
          go run . gen-docs docs/reference
          git diff --exit-code -- docs/reference || (echo "::error::docs/reference is stale - run: go run . gen-docs docs/reference" && exit 1)

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ── 2b. Frontend checks ────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --cwd gui/frontend --frozen-lockfile

      - name: Typecheck
        working-directory: gui/frontend
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: gui/frontend
        run: bunx vitest run

  # ── 3. Build binaries ──────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
          - goos: windows
            goarch: arm64
            runs-on: windows-11-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/aminmesbahi/skell/internal/version.Version=${{ github.ref_name }}" -o dist/skell-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: skell-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  # ── 4. Build GUI (Windows) ─────────────────────────────────────────────────
  build-gui-windows:
    name: Build GUI + EXE (windows/${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The Wails build also compiles the root CLI module, which needs the
          # newer Go version from the root go.mod.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --cwd frontend

      - name: Build GUI
        working-directory: gui
        env:
          GOARCH: ${{ matrix.arch }}
        run: wails3 build

      - name: Test GUI Go module
        working-directory: gui
        run: go test ./...

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package NSIS installer (EXE)
        working-directory: gui
        run: wails3 package

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: skell-gui-windows-${{ matrix.arch }}
          path: |
            gui/build/bin/
          retention-days: 7

  # ── 5. Build GUI (macOS) ───────────────────────────────────────────────────
  build-gui-macos:
    name: Build GUI + DMG (darwin/arm64)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The Wails build also compiles the root CLI module, which needs the
          # newer Go version from the root go.mod.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --cwd frontend

      - name: Build GUI
        working-directory: gui
        env:
          GOARCH: arm64
        run: wails3 package

      - name: Test GUI Go module
        working-directory: gui
        run: go test ./...

      - name: Package DMG
        working-directory: gui
        run: wails3 tool package -format dmg -name Skell -out build/bin

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: skell-gui-darwin-arm64
          path: |
            gui/build/bin/*.dmg
            gui/build/bin/Skell.app
          retention-days: 7

  # ── 6. Build GUI (Linux) ───────────────────────────────────────────────────
  build-gui-linux:
    name: Build GUI (linux/amd64)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The Wails build also compiles the root CLI module, which needs the
          # newer Go version from the root go.mod.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install GTK/WebKit build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --cwd frontend

      - name: Build GUI
        working-directory: gui
        run: wails3 build

      - name: Test GUI Go module
        working-directory: gui
        run: go test ./...

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: skell-gui-linux-amd64
          path: gui/build/bin/Skell
          retention-days: 7
