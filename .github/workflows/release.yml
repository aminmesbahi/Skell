name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── CLI — GoReleaser ───────────────────────────────────────────────────────
  release-cli:
    name: GoReleaser (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Desktop GUI — Windows ──────────────────────────────────────────────────
  release-gui-windows:
    name: Build & upload GUI (windows/amd64)
    runs-on: windows-latest
    needs: release-cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2

      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --cwd frontend

      - name: Build GUI
        working-directory: gui
        run: wails3 build

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package NSIS installer (EXE)
        working-directory: gui
        run: wails3 package

      - name: Locate built binaries
        id: locate
        shell: pwsh
        run: |
          $binDir = "gui/build/bin"
          $exe = Get-ChildItem -Path $binDir -Filter "Skell*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path gui/bin -Filter "Skell*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "Searching for any .exe in build output..."
            Get-ChildItem -Path gui -Filter "*.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "Could not find Skell.exe in gui/build/bin/ or gui/bin/"
          }
          Write-Host "Found binary: $($exe.FullName)"
          "gui_exe=$($exe.FullName -replace '\\','/')" >> $env:GITHUB_OUTPUT
          $installer = Get-ChildItem -Path $binDir -Filter "*installer*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Write-Host "Found installer: $($installer.FullName)"
            "gui_installer=$($installer.FullName -replace '\\','/')" >> $env:GITHUB_OUTPUT
          }

      - name: Build bundled Windows package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $versionNum = $version.TrimStart("v")
          $bundleDir = Join-Path $PWD "bundle"
          $cliZip = Join-Path $PWD "skell.zip"
          $bundleZip = Join-Path $PWD "skell_${versionNum}_windows_amd64_bundle.zip"
          $cliUrl = "https://github.com/${{ github.repository }}/releases/download/$version/skell_${versionNum}_windows_amd64.zip"

          Remove-Item -Path $bundleDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          $downloaded = $false
          for ($attempt = 1; $attempt -le 5 -and -not $downloaded; $attempt++) {
            try {
              Invoke-WebRequest -Uri $cliUrl -OutFile $cliZip -UseBasicParsing
              $downloaded = $true
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 5
            }
          }

          Expand-Archive -Path $cliZip -DestinationPath $bundleDir -Force
          Copy-Item "${{ steps.locate.outputs.gui_exe }}" (Join-Path $bundleDir "skell-gui.exe") -Force
          Compress-Archive -Path (Join-Path $bundleDir "skell.exe"), (Join-Path $bundleDir "skell-gui.exe") -DestinationPath $bundleZip -Force

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.locate.outputs.gui_exe }}
            ${{ steps.locate.outputs.gui_installer }}
            skell_*_windows_amd64_bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Desktop GUI — macOS ────────────────────────────────────────────────────
  release-gui-macos:
    name: Build & upload GUI (darwin/${{ matrix.arch }})
    needs: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: amd64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2

      - name: Install frontend dependencies
        working-directory: gui
        run: bun install --cwd frontend

      - name: Build GUI
        working-directory: gui
        env:
          GOARCH: ${{ matrix.arch }}
        run: wails3 build

      - name: Package DMG
        id: dmg
        working-directory: gui
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          versionNum="${version#v}"

          # Create DMG via wails3 tool package
          wails3 tool package -format dmg -name Skell -out build/bin

          # Rename DMG to include version + arch
          dmgFile=$(ls build/bin/*.dmg 2>/dev/null | head -1)
          if [ -n "$dmgFile" ]; then
            newName="Skell_${versionNum}_darwin_${{ matrix.arch }}.dmg"
            mv "$dmgFile" "build/bin/${newName}"
            echo "dmg_file=build/bin/${newName}" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip Skell.app
        id: zipapp
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          versionNum="${version#v}"
          appZip="Skell_${versionNum}_darwin_${{ matrix.arch }}.zip"
          (cd gui/build/bin && zip -ry "../../../${appZip}" Skell.app)
          echo "app_zip=${appZip}" >> "$GITHUB_OUTPUT"

      - name: Build bundled macOS package
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          versionNum="${version#v}"
          bundleDir="$PWD/bundle"
          cliTar="$PWD/skell.tar.gz"
          bundleZip="$PWD/skell_${versionNum}_darwin_${{ matrix.arch }}_bundle.zip"
          cliUrl="https://github.com/${{ github.repository }}/releases/download/${version}/skell_${versionNum}_darwin_${{ matrix.arch }}.tar.gz"

          rm -rf "$bundleDir"
          mkdir -p "$bundleDir"

          # The CLI tarball is uploaded by the release-cli job; retry while it
          # propagates through the GitHub release CDN.
          downloaded=0
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 3 -o "$cliTar" "$cliUrl"; then
              downloaded=1
              break
            fi
            sleep 5
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "failed to download CLI tarball from $cliUrl" >&2
            exit 1
          fi

          tar -xzf "$cliTar" -C "$bundleDir"
          cp -R gui/build/bin/Skell.app "$bundleDir/"
          (cd "$bundleDir" && zip -ry "$bundleZip" skell Skell.app)
          echo "bundle_zip=$bundleZip" >> "$GITHUB_OUTPUT"

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.zipapp.outputs.app_zip }}
            ${{ steps.dmg.outputs.dmg_file }}
            ${{ steps.bundle.outputs.bundle_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
